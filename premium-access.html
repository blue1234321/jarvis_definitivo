<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso Premium | COSMOS JARVIS</title>
<style>
body{margin:0;min-height:100vh;background:#050307;color:white;font-family:system-ui;display:grid;place-items:center}
.box{width:min(430px,88vw);padding:32px;border:1px solid #ffd15a;border-radius:18px;text-align:center;background:#100707;box-shadow:0 0 50px #ff202833}
h1{color:#ff2028}.sub{color:#ffd15a;letter-spacing:4px;font-size:11px}

</style></head><body><div class="box">
<div class="sub">COSMOS · JARVIS</div><h1>ACCESO PREMIUM</h1>
<p>Introduce el código para abrir la interfaz roja y dorada.</p>
<input id="code" type="password" placeholder="Código PIKARI">

</div>
<script>
function go(){
 if(document.getElementById('code').value.trim().toUpperCase()==='PIKARI'){
   location.href='premium.html';
 }else document.getElementById('s').textContent='Código incorrecto.';
}
</script></body></html>
